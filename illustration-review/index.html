<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04 イラスト・結果画面比較</title><style>*{box-sizing:border-box}body{margin:0;color:#233c4b;font-family:Meiryo,sans-serif;background:#edf2f4}nav{padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:white}select,a,button{font:inherit}a{color:#233c4b}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}h2{font-size:18px;margin:0 0 10px}iframe{display:block;width:100%;height:78vh;border:1px solid #ccd7dc;background:white}.mobile iframe{max-width:390px;margin:auto}.mobile section{max-width:420px;width:100%;margin:auto}@media(max-width:850px){.views{grid-template-columns:1fr}iframe{height:75vh}}button{padding:7px 12px;background:white;border:1px solid #8196a0;border-radius:4px;cursor:pointer}</style><nav><strong>04 イラスト比較</strong><select id="type"><option value="0">しゃべりすぎ</option><option value="1">マウント</option><option value="2">ネガティブ</option><option value="3">マイペース</option><option value="4">過干渉</option><option value="5">カッコつけ</option><option value="6">無反応</option></select><button id="jump">04を表示</button><button id="mobile">スマホ幅に切替</button></nav><main class="views"><section><h2>案1：タカさん案</h2><a id="openA" target="_blank">結果画面を開く</a><iframe id="a" title="タカさん案"></iframe></section><section><h2>案2：今回の案</h2><a id="openB" target="_blank">結果画面を開く</a><iframe id="b" title="今回の案"></iframe></section></main><script>const a=document.querySelector('#a'),b=document.querySelector('#b');function update(){let t=document.querySelector('#type').value;for(const [f,v,id] of [[a,'taka','openA'],[b,'proposal','openB']]){let u='screen.html?variant='+v+'&type='+t;f.src=u;document.getElementById(id).href=u}}function jump(){for(const f of [a,b])f.contentDocument.querySelector('.changes').closest('section').scrollIntoView()}document.querySelector('#jump').onclick=jump;document.querySelector('#type').onchange=update;document.querySelector('#mobile').onclick=()=>{let m=document.querySelector('main').classList.toggle('mobile');document.querySelector('#mobile').textContent=m?'通常幅に切替':'スマホ幅に切替'};for(const f of [a,b])f.onload=()=>f.contentDocument.fonts.ready.then(()=>f.contentDocument.querySelector('.changes').closest('section').scrollIntoView());update();</script></html>
