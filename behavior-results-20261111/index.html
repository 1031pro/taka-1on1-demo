<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>行動選択版｜結果画面一覧</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#203949;background:#f2f5f6;font:16px/1.55 Meiryo,sans-serif}main{max-width:1180px;margin:auto;padding:clamp(18px,4vw,48px)}h1{font-size:clamp(24px,4vw,35px);margin:0 0 18px}h2{margin:32px 0 12px;font-size:22px}button,input{font:inherit}button{cursor:pointer}.gate{max-width:390px;margin:12vh auto;padding:26px;background:white;border-radius:10px}.gate input,.gate button{display:block;width:100%;padding:9px;margin:6px 0 14px}.gate button,.switch button[aria-pressed=true]{background:#203949;color:white}.switch{display:flex;gap:6px}.switch button{padding:8px 20px;border:1px solid #8dabb8;background:white;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(235px,100%),1fr));gap:16px}.card{display:block;background:white;color:inherit;text-decoration:none;padding:12px;border-radius:6px;border:1px solid #ccd7dc}.card:hover,.card:focus-visible{border-color:#94213c}.card strong{display:block;margin-top:10px}.preview{height:240px;display:flex;justify-content:center;background:#e7edef}.preview img{display:block;height:100%;max-width:100%;object-fit:contain}a{color:#165679}.note{font-size:14px}
</style><main>
<form class="gate"><h1>行動選択版<br>結果画面一覧</h1><label>パスワード<input type="password" required autofocus></label><button>表示する</button><span role="alert"></span></form>
<section id="gallery" hidden><h1>行動選択版の結果画面</h1><div class="switch" aria-label="表示サイズ"><button data-width="1440" aria-pressed="true">PC</button><button data-width="390" aria-pressed="false">スマホ</button></div><p class="note">画像を選ぶと、結果画面全体を原寸で開けます。</p><div id="groups"></div></section></main><script src="cases.js"></script>
<script>
const groups=document.querySelector('#groups');
function render(width){
 document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.width===width)));
 groups.replaceChildren();
 for(const [label,items] of [['単独1位',cases.filter(([key])=>key.startsWith('solo'))],['同率1位',cases.filter(([key])=>key.startsWith('tie')||key==='pick')],['その他の回答例',cases.filter(([key])=>!key.startsWith('solo')&&!key.startsWith('tie')&&key!=='pick')]]){
  const h=document.createElement('h2');h.textContent=label;const grid=document.createElement('div');grid.className='grid';
  for(const [key,title] of items){
   const a=document.createElement('a');a.className='card';a.href='images/'+key+'-'+width+'.webp';
   const preview=document.createElement('div');preview.className='preview';const img=document.createElement('img');img.alt='';img.src='images/'+key+'-'+width+'-small.webp';preview.append(img);
   const name=document.createElement('strong');name.textContent=title;a.append(preview,name);
   if(key.startsWith('tie')||key==='lowtie'){const detail=document.createElement('small');detail.textContent='「同率のまま結果を見る」を選択';a.append(detail);}
   grid.append(a);
  }
  groups.append(h,grid);
 }
}
document.querySelector('form').onsubmit=e=>{e.preventDefault();if(document.querySelector('input').value!=='vak'){document.querySelector('[role=alert]').textContent='パスワードが違います。';return;}e.target.hidden=true;document.querySelector('#gallery').hidden=false;render(matchMedia('(max-width:640px)').matches?'390':'1440');};
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>render(b.dataset.width));
</script></html>
